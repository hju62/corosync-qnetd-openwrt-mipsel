name: Build corosync-qnetd (RT-AX59U / 25.12.5)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download and extract OpenWrt 25.12.5 SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic"
          SDK_FILE=$(wget -qO- "$BASE_URL/" | grep -oE 'openwrt-sdk-25\.12\.5-mediatek-filogic_[^"]+\.tar\.(zst|xz)' | head -n 1)
          echo "Downloading $SDK_FILE"
          wget -q "$BASE_URL/$SDK_FILE"
          mkdir -p sdk
          tar -xf "$SDK_FILE" -C sdk --strip-components=1
          rm -f "$SDK_FILE"

      - name: Prepare all repository packages and feeds
        run: |
          for mf in $(find . -maxdepth 4 -not -path './sdk/*' -not -path './.git/*' -name 'Makefile'); do
            pkg_dir=$(dirname "$mf")
            pkg_name=$(basename "$pkg_dir")
            echo "Copying package $pkg_name from $pkg_dir"
            mkdir -p "sdk/package/$pkg_name"
            cp -r "$pkg_dir"/* "sdk/package/$pkg_name/"
          done

          cd sdk
          ./scripts/feeds update base packages
          ./scripts/feeds install bash coreutils openssh-sftp-server procps-ng nspr libnss nss-utils openssl-util
          make defconfig

      - name: Compile corosync-qnetd
        run: |
          cd sdk
          make package/corosync-qnetd/compile V=s -j$(nproc)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corosync-qnetd-ax59u-25.12.5
          path: sdk/bin/packages/aarch64_cortex-a53/base/*.apk
